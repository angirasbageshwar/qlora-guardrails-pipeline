# ── Everything the training run needs, in one reviewable file ────────────────
model:
  base_model: "meta-llama/Meta-Llama-3-8B-Instruct"   # or mistralai/Mistral-7B-Instruct-v0.3
  # Tip for a first smoke test on a small GPU: "Qwen/Qwen2.5-0.5B-Instruct"

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  max_seq_length: 1024

qlora:                      # LoRA adapter shape
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                   "gate_proj", "up_proj", "down_proj"]

training:
  output_dir: "outputs/adapter"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8       # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  save_strategy: "epoch"
  bf16: true                            # set false + fp16 true on pre-Ampere GPUs
  gradient_checkpointing: true
  packing: true
  seed: 42

wandb:
  project: "qlora-domain-llm"
  run_name: "llama3-8b-qlora-v1"
